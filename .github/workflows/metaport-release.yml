name: Notify Metaport of tagged release

on:
  push:
    tags:
      - 'v*'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: PUT release to Metaport
        env:
          METAPORT_TOKEN: ${{ secrets.METAPORT_TOKEN }}
          METAPORT_IDENTIFIER: ${{ secrets.METAPORT_IDENTIFIER }}
          METAPORT_DOMAIN: ${{ secrets.METAPORT_DOMAIN }}
          METAPORT_ENVIRONMENT: ${{ secrets.METAPORT_ENVIRONMENT }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          jq -n \
            --arg identifier  "$METAPORT_IDENTIFIER" \
            --arg environment "$METAPORT_ENVIRONMENT" \
            --arg domain      "$METAPORT_DOMAIN" \
            --arg version     "$VERSION" \
            '{
              format: "MetaportIngest",
              version: "1.0",
              data: {
                identifier: $identifier,
                environment: $environment,
                domain: $domain,
                stack: "PHP/Composer",
                version: $version,
                source: "CI"
              }
            }' > payload.json

          curl --fail-with-body -sS -X PUT \
            -H "User-Agent: metaport-ci" \
            -H "Content-Type: application/json" \
            -H "Authorization: Basic ${METAPORT_TOKEN}" \
            -d @payload.json \
            https://metaport.dev/api/v1/app/
