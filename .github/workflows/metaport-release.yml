name: Notify Metaport of tagged release

on:
  push:
    tags:
      - 'v*'

jobs:
  notify:
    runs-on: ubuntu-latest
    environment: Demo
    steps:
      - name: Resolve release version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: PUT release to Metaport
        env:
          APP_IDENTIFIER: ${{ secrets.METAPORT_APP_IDENTIFIER }}
          APP_ENVIRONMENT: ${{ secrets.METAPORT_APP_ENVIRONMENT }}
          APP_DOMAIN: ${{ secrets.METAPORT_APP_DOMAIN }}
          APP_VERSION: ${{ steps.ver.outputs.version }}
          APP_API_TOKEN: ${{ secrets.METAPORT_APP_API_TOKEN }}
          METAPORT_SERVER: ${{ secrets.METAPORT_SERVER }}
        run: |
          jq -n \
            --arg identifier  "$APP_IDENTIFIER" \
            --arg environment "$APP_ENVIRONMENT" \
            --arg domain      "$APP_DOMAIN" \
            --arg version     "$APP_VERSION" \
            '{
              format: "MetaportIngest",
              version: "1.0",
              data: {
                identifier: $identifier,
                environment: $environment,
                domain: $domain,
                stack: "PHP/Composer",
                version: $version,
                source: "CI"
              }
            }' > payload.json

          curl --fail-with-body -X PUT \
            -H "User-Agent: metaport-ci" \
            -H "Content-Type: application/json" \
            -H "Authorization: Basic ${APP_API_TOKEN}" \
            -d @payload.json \
            ${METAPORT_SERVER}/api/v1/app
